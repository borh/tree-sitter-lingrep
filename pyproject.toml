[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-lingrep"
description = "Grammar for lingrep patterns"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "lingrep"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Bor Hodošček", email = "dev@bor.space" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/borh/tree-sitter-lingrep"

[project.optional-dependencies]
core = ["tree-sitter>=0.25"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
