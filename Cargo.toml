[package]
name = "tree-sitter-lingrep"
description = "Grammar for lingrep patterns"
version = "0.1.0"
authors = ["Bor Hodošček <dev@bor.space>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "lingrep"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/borh/tree-sitter-lingrep"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "queries/*", "src/*", "LICENSE"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.1.22"

[dev-dependencies]
tree-sitter = "0.26.11"
